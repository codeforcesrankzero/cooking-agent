services:
  app:
    build: .
    container_name: cooking-agent-app
    env_file:
      - .env
    environment:
      # Reuse HuggingFace cache between restarts (important for startup time).
      HF_HOME: /app/data/hf_cache
      # Default for containers: avoid OOM/startup issues; let lazy loading happen.
      PRELOAD_EMBEDDINGS_ON_STARTUP: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  prometheus:
    image: prom/prometheus:latest
    container_name: cooking-agent-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: cooking-agent-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

